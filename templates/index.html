<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Wrong Door</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 60px auto;
            padding: 0 20px;
        }
        section {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        input {
            padding: 8px;
            margin: 4px 0;
            width: 420px;
            max-width: 90%;
            box-sizing: border-box;
        }
        button {
            padding: 8px 14px;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <h1>Wrong Door</h1>

    <section>
        <h2>Login</h2>
        <form method="POST" action="/">
            <input name="username" placeholder="Username">
            <br>
            <input name="password" type="password" placeholder="Password">
            <br>
            <button type="submit">Login</button>
        </form>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
    </section>

    <section>
        <h2>Search Posts</h2>
        <form method="GET" action="/search">
            <input name="q" value="{{ query|default('') }}" placeholder="Search">
            <button type="submit">Search</button>
        </form>

        {% if results is not none %}
            <h3>Results</h3>
            {% for row in results %}
                <div class="result">
                    <strong>{{ row["title"] }}</strong><br>
                    {{ row["content"] }}
                </div>
            {% else %}
                <p>No results.</p>
            {% endfor %}
        {% endif %}
    </section>
</body>
</html>
